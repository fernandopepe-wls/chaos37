<!DOCTYPE html>
<html>
<head><style>body{margin:0;background:#1a1530;overflow:hidden}canvas{display:block}</style></head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

const E = {
  easeInQuart:  t => t * t * t * t,
  easeOutQuad:  t => 1 - (1 - t) ** 2,
  easeOutCubic: t => 1 - (1 - t) ** 3,
  easeOutExpo:  t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  easeOutBack:  t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); },
  smoothstep:   t => t * t * (3 - 2 * t),
  holdThenCollapse: t => t < 0.7 ? 0 : (t - 0.7) / 0.3,
  dissolveLate: t => t < 0.55 ? 0 : (t - 0.55) / 0.45,
  fadeLate: t => { if (t < 0.45) return 0; const u = (t - 0.45) / 0.55; return u * u * (3 - 2 * u); },
};

const lerp = (a, b, t) => a + (b - a) * t;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

// Pre-baked tileable noise mask for puff dissolve
const NOISE_SIZE = 128;
const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = noiseCanvas.height = NOISE_SIZE;
{
  const nctx = noiseCanvas.getContext('2d');
  const img = nctx.createImageData(NOISE_SIZE, NOISE_SIZE);
  // Chunky cell noise (cartoon-friendly, large bites)
  const cells = 14;
  const cellSize = NOISE_SIZE / cells;
  const grid = [];
  for (let i = 0; i < cells * cells; i++) grid.push(Math.random());
  for (let y = 0; y < NOISE_SIZE; y++) {
    for (let x = 0; x < NOISE_SIZE; x++) {
      const cx = Math.floor(x / cellSize), cy = Math.floor(y / cellSize);
      const v = grid[cy * cells + cx];
      const i = (y * NOISE_SIZE + x) * 4;
      const g = Math.floor(v * 255);
      img.data[i] = img.data[i+1] = img.data[i+2] = g;
      img.data[i+3] = 255;
    }
  }
  nctx.putImageData(img, 0, 0);
}

class P {
  constructor(o) { Object.assign(this, { life:0, vx:0, vy:0, gx:0, gy:0, drag:0, rot:0, vrot:0, alpha0:1, alpha1:1, size0:10, size1:10, h0:0, s0:0, l0:50, h1:null, s1:null, l1:null, outline:0, blend:'source-over', dissolve:null, seed:Math.random(), points:5, innerRatio:0.5, lineW:0, killAtY:null, easeSize:E.smoothstep, easeAlpha:E.smoothstep, easeColor:E.smoothstep }, o); this.h1 ??= this.h0; this.s1 ??= this.s0; this.l1 ??= this.l0; }
  step(dt) {
    this.life += dt;
    this.vx *= Math.max(0, 1 - this.drag * dt);
    this.vy *= Math.max(0, 1 - this.drag * dt);
    this.vx += this.gx * dt; this.vy += this.gy * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.vrot * dt;
    if (this.killAtY !== null && this.y > this.killAtY) this.life = this.lifetime;
  }
  draw(ctx) {
    const t = Math.min(1, this.life / this.lifetime);
    const sz = lerp(this.size0, this.size1, this.easeSize(t));
    const a  = lerp(this.alpha0, this.alpha1, this.easeAlpha(t));
    const ct = this.easeColor(t);
    const h = lerp(this.h0, this.h1, ct), s = lerp(this.s0, this.s1, ct), l = lerp(this.l0, this.l1, ct);
    if (sz <= 0 || a <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = this.blend;
    ctx.globalAlpha = a;
    ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    drawShape(ctx, this.shape, sz, h, s, l, this);
    ctx.restore();
    // Dissolve mask pass
    if (this.dissolve) {
      const thresh = this.dissolve(t);
      if (thresh > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        const ox = (this.seed * 73) % NOISE_SIZE, oy = (this.seed * 131) % NOISE_SIZE;
        const r = sz * 1.1;
        ctx.globalAlpha = Math.min(1, thresh * 1.4);
        // tile noise across the shape bounding box, with alpha cutoff via filter trick
        const pat = ctx.createPattern(noiseCanvas, 'repeat');
        ctx.fillStyle = pat;
        ctx.translate(-ox, -oy);
        // Use threshold: draw only the "bright" portion as eraser. Simulate via second canvas.
        ctx.fillRect(-r - ox, -r - oy, r * 2, r * 2);
        ctx.restore();
      }
    }
  }
}

function drawShape(ctx, kind, sz, h, s, l, p) {
  ctx.fillStyle = hsl(h, s, l);
  switch (kind) {
    case 'circle':
      ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.fill();
      if (p.outline) { ctx.lineWidth = p.outline; ctx.strokeStyle = hsl(h, Math.min(100,s+10), Math.max(15, l-40)); ctx.stroke(); }
      break;
    case 'softCircle': {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, sz / 2);
      g.addColorStop(0, hsl(h, s, l, 1));
      g.addColorStop(0.5, hsl(h, s, l, 0.6));
      g.addColorStop(1, hsl(h, s, l, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.fill();
      break;
    }
    case 'star': {
      const pts = p.points, ir = (sz / 2) * p.innerRatio, or = sz / 2;
      ctx.beginPath();
      for (let i = 0; i < pts * 2; i++) {
        const r = i % 2 === 0 ? or : ir, ang = (i / (pts * 2)) * TAU - Math.PI / 2;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill();
      if (p.outline) { ctx.lineWidth = p.outline; ctx.lineJoin = 'round'; ctx.strokeStyle = hsl(18, 90, 22); ctx.stroke(); }
      break;
    }
    case 'puffCartoon': {
      // 4-lobe cloud silhouette, asymmetric via seed
      const r = sz / 2;
      const lobes = 5;
      ctx.beginPath();
      for (let i = 0; i < lobes; i++) {
        const ang = (i / lobes) * TAU + p.seed * TAU;
        const lr = r * (0.55 + ((p.seed * 17 + i) % 1) * 0.25);
        const lx = Math.cos(ang) * r * 0.45, ly = Math.sin(ang) * r * 0.45;
        ctx.moveTo(lx + lr, ly); ctx.arc(lx, ly, lr, 0, TAU);
      }
      // center lobe
      ctx.moveTo(r * 0.6, 0); ctx.arc(0, 0, r * 0.7, 0, TAU);
      ctx.fill('nonzero');
      if (p.outline) { ctx.lineWidth = p.outline; ctx.strokeStyle = hsl(h, Math.min(100,s+15), Math.max(20, l-35)); ctx.stroke(); }
      // highlight blob
      ctx.fillStyle = hsl(h, s - 15, Math.min(95, l + 20), 0.6);
      ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.25, r * 0.3, 0, TAU); ctx.fill();
      break;
    }
    case 'diamond': {
      const r = sz / 2;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.6, 0); ctx.closePath();
      ctx.fill();
      if (p.outline) { ctx.lineWidth = p.outline; ctx.lineJoin = 'round'; ctx.strokeStyle = hsl(h, s, Math.max(15, l - 40)); ctx.stroke(); }
      break;
    }
    case 'shockwave': {
      ctx.lineWidth = p.lineW || 8;
      ctx.strokeStyle = hsl(h, s, l);
      ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.stroke();
      // inner darker ring
      ctx.lineWidth = (p.lineW || 8) * 0.4;
      ctx.strokeStyle = hsl(18, 85, 30);
      ctx.beginPath(); ctx.arc(0, 0, sz / 2 - (p.lineW || 8) * 0.6, 0, TAU); ctx.stroke();
      break;
    }
    case 'speedlines': {
      ctx.strokeStyle = hsl(h, s, l);
      ctx.lineWidth = p.lineW || 4;
      ctx.lineCap = 'round';
      const r = sz / 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.45, 0); ctx.lineTo(r, 0);
      ctx.stroke();
      break;
    }
  }
}

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let particles = [];

function spawnExplosionChibi(cx, cy) {
  // ── ANTICIPATION (0–0.10s) — tiny squash dot
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.10,
    size0: 30, size1: 0, alpha0: 1, alpha1: 1,
    h0: 50, s0: 100, l0: 85,
    shape: 'circle', blend: 'lighter',
    easeSize: E.easeInQuart,
  }));

  // delayed-spawn helper via lifetime/offset is approximated by spawning all at t=0
  // with adjusted lifetimes. For exact timing, sequence at spawn site.
  setTimeout(() => spawnClimaxAndAfter(cx, cy), 100);
}

function spawnClimaxAndAfter(cx, cy) {
  // ── CLIMAX (0.10–0.30s) ──

  // Hard yellow core flash — additive, triple-attack
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.18,
    size0: 80, size1: 280, alpha0: 1, alpha1: 0,
    h0: 52, s0: 100, l0: 88, h1: 40, s1: 100, l1: 20,
    shape: 'softCircle', blend: 'lighter',
    easeSize: E.easeOutExpo, easeAlpha: E.easeOutExpo,
  }));

  // Big star burst — pop with easeOutBack, hard cut at end
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.45,
    size0: 100, size1: 360, alpha0: 1, alpha1: 1,
    h0: 42, s0: 100, l0: 62, h1: 18, s1: 95, l1: 50,
    shape: 'star', points: 8, innerRatio: 0.42,
    outline: 10, rot: rand(0, TAU),
    easeSize: E.easeOutBack, easeColor: E.easeOutQuad,
  }));

  // Inner star (smaller, brighter, offset rotation)
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.35,
    size0: 50, size1: 220, alpha0: 1, alpha1: 1,
    h0: 52, s0: 100, l0: 78, h1: 38, s1: 100, l1: 65,
    shape: 'star', points: 6, innerRatio: 0.55,
    outline: 6, rot: rand(0, TAU),
    easeSize: E.easeOutBack, easeColor: E.easeOutQuad,
  }));

  // Shockwave ring — hard outline, no fill
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.30,
    size0: 60, size1: 480, alpha0: 1, alpha1: 1,
    h0: 48, s0: 100, l0: 88,
    shape: 'shockwave', lineW: 14,
    easeSize: E.easeOutExpo,
  }));

  // Speedlines — 10 radial outward
  for (let i = 0; i < 10; i++) {
    const ang = (i / 10) * TAU + rand(-0.08, 0.08);
    particles.push(new P({
      x: cx, y: cy, lifetime: 0.22,
      size0: 80, size1: 320,
      h0: 52, s0: 100, l0: 80,
      shape: 'speedlines', lineW: 6, rot: ang,
      easeSize: E.easeOutExpo,
    }));
  }

  // ── DISSIPATION (0.30–1.00s) — smoke + debris + sparkles ──

  // 8 cartoon smoke puffs, candy orange shift toward warm gray, hold-then-collapse
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * TAU + rand(-0.25, 0.25);
    const sp = rand(220, 360);
    particles.push(new P({
      x: cx, y: cy, lifetime: 0.90,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      drag: 4.2, gy: -180,
      size0: 70, size1: 140, alpha0: 1, alpha1: 1,
      h0: 28, s0: 85, l0: 58, h1: 22, s1: 25, l1: 55,
      shape: 'puffCartoon', outline: 5,
      easeSize: E.holdThenCollapse,
      easeColor: E.easeOutCubic,
      vrot: rand(-1, 1),
    }));
  }

  // Gray smoke — 5 puffs rising, flat size (no growth), hold-then-collapse
  for (let i = 0; i < 5; i++) {
    const ang = -Math.PI / 2 + rand(-1.0, 1.0);
    const sp = rand(70, 160);
    const s = rand(90, 120);
    particles.push(new P({
      x: cx + rand(-40, 40), y: cy + rand(-20, 20), lifetime: rand(0.85, 1.05),
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      drag: 1.8, gy: -90,
      size0: s, size1: s * 0.75, alpha0: 1, alpha1: 0,
      h0: 25, s0: 28, l0: 58, h1: 22, s1: 14, l1: 70,
      shape: 'puffCartoon', outline: 4,
      easeSize: E.easeOutQuad,
      easeAlpha: E.fadeLate,
      easeColor: E.smoothstep,
      vrot: rand(-0.5, 0.5),
    }));
  }

  // Debris diamonds (gravity-affected, scale-to-zero)
  for (let i = 0; i < 12; i++) {
    const ang = rand(-Math.PI, 0) + rand(-0.3, 0.3); // mostly upward
    const sp = rand(280, 520);
    particles.push(new P({
      x: cx, y: cy, lifetime: rand(0.55, 0.75),
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      drag: 1.2, gy: 900,
      size0: 22, size1: 0, alpha0: 1, alpha1: 1,
      h0: 42, s0: 100, l0: 62, h1: 18, s1: 95, l1: 45,
      shape: 'diamond', outline: 3,
      easeSize: E.easeInQuart,
      vrot: rand(-8, 8), rot: rand(0, TAU),
    }));
  }

  // Sparkle stars trailing — additive triple-attack
  for (let i = 0; i < 16; i++) {
    const ang = rand(0, TAU);
    const sp = rand(180, 420);
    particles.push(new P({
      x: cx, y: cy, lifetime: rand(0.40, 0.65),
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      drag: 2.8, gy: 200,
      size0: 18, size1: 0, alpha0: 1, alpha1: 0,
      h0: 55, s0: 100, l0: 82, h1: 38, s1: 100, l1: 10,
      shape: 'star', points: 4, innerRatio: 0.35,
      outline: 0, blend: 'lighter',
      easeSize: E.easeInQuart, easeAlpha: E.easeOutQuad,
      easeColor: E.smoothstep, vrot: rand(-6, 6),
    }));
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  ctx.fillStyle = '#1a1530';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  for (const p of particles) p.step(dt);
  particles = particles.filter(p => p.life < p.lifetime);
  // back-to-front: alphablended first, additive last
  particles.sort((a, b) => (a.blend === 'lighter') - (b.blend === 'lighter'));
  for (const p of particles) p.draw(ctx);
  requestAnimationFrame(loop);
}

cvs.addEventListener('click', e => {
  const r = cvs.getBoundingClientRect();
  spawnExplosionChibi(e.clientX - r.left, e.clientY - r.top);
});
spawnExplosionChibi(400, 400);
setInterval(() => spawnExplosionChibi(400, 400), 2000);
requestAnimationFrame(loop);
</script>
</body>
</html>
