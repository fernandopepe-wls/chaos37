<!DOCTYPE html>
<html>
<head>
<title>Hit-Impact Chibi VFX Preview</title>
<style>
  body { margin: 0; background: #1a1530; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; pointer-events: none;
  }
  #hud b { color: #00d4ff; }
  .key { background: #333; padding: 1px 6px; border-radius: 3px; font-family: monospace; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<div id="hud">
  <b>Hit-Impact Chibi VFX</b><br>
  Click anywhere to trigger<br>
  <span class="key">SPACE</span> auto-loop &nbsp; <span class="key">R</span> reset
</div>
<script>
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

const E = {
  easeInQuart:  t => t * t * t * t,
  easeOutQuad:  t => 1 - (1 - t) ** 2,
  easeOutCubic: t => 1 - (1 - t) ** 3,
  easeOutExpo:  t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  easeOutBack:  t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); },
  smoothstep:   t => t * t * (3 - 2 * t),
};

const lerp = (a, b, t) => a + (b - a) * t;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

class P {
  constructor(o) {
    Object.assign(this, {
      life: 0, vx: 0, vy: 0, gx: 0, gy: 0, drag: 0, rot: 0, vrot: 0,
      alpha0: 1, alpha1: 1, size0: 10, size1: 10,
      h0: 0, s0: 0, l0: 50, h1: null, s1: null, l1: null,
      outline: 0, blend: 'source-over',
      points: 5, innerRatio: 0.5, lineW: 0,
      easeSize: E.smoothstep, easeAlpha: E.smoothstep, easeColor: E.smoothstep,
    }, o);
    this.h1 ??= this.h0; this.s1 ??= this.s0; this.l1 ??= this.l0;
  }
  step(dt) {
    this.life += dt;
    this.vx *= Math.max(0, 1 - this.drag * dt);
    this.vy *= Math.max(0, 1 - this.drag * dt);
    this.vx += this.gx * dt; this.vy += this.gy * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.vrot * dt;
  }
  draw(ctx) {
    const t = Math.min(1, this.life / this.lifetime);
    const sz = lerp(this.size0, this.size1, this.easeSize(t));
    const a  = lerp(this.alpha0, this.alpha1, this.easeAlpha(t));
    const ct = this.easeColor(t);
    const h = lerp(this.h0, this.h1, ct);
    const s = lerp(this.s0, this.s1, ct);
    const l = lerp(this.l0, this.l1, ct);
    if (sz <= 0 || a <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = this.blend;
    ctx.globalAlpha = a;
    ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    drawShape(ctx, this.shape, sz, h, s, l, this);
    ctx.restore();
  }
}

function drawShape(ctx, kind, sz, h, s, l, p) {
  ctx.fillStyle = hsl(h, s, l);
  switch (kind) {
    case 'circle':
      ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.fill();
      if (p.outline) {
        ctx.lineWidth = p.outline;
        ctx.strokeStyle = hsl(h, Math.min(100, s + 10), Math.max(15, l - 40));
        ctx.stroke();
      }
      break;
    case 'star': {
      const pts = p.points, ir = (sz / 2) * p.innerRatio, or = sz / 2;
      ctx.beginPath();
      for (let i = 0; i < pts * 2; i++) {
        const r = i % 2 === 0 ? or : ir;
        const ang = (i / (pts * 2)) * TAU - Math.PI / 2;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill();
      if (p.outline) {
        ctx.lineWidth = p.outline; ctx.lineJoin = 'round';
        ctx.strokeStyle = hsl(h, Math.min(100, s + 5), Math.max(15, l - 40));
        ctx.stroke();
      }
      break;
    }
    case 'diamond': {
      const r = sz / 2;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.6, 0);
      ctx.closePath(); ctx.fill();
      if (p.outline) {
        ctx.lineWidth = p.outline; ctx.lineJoin = 'round';
        ctx.strokeStyle = hsl(h, s, Math.max(15, l - 40));
        ctx.stroke();
      }
      break;
    }
    case 'shockwave': {
      ctx.lineWidth = p.lineW || 8;
      ctx.strokeStyle = hsl(h, s, l);
      ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.stroke();
      break;
    }
    case 'speedlines': {
      ctx.strokeStyle = hsl(h, s, l);
      ctx.lineWidth = p.lineW || 4;
      ctx.lineCap = 'round';
      const r = sz / 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.5, 0); ctx.lineTo(r, 0);
      ctx.stroke();
      break;
    }
  }
}

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let particles = [];

function spawnHitImpactChibi(cx, cy) {
  // ── WHITE FLASH STAR: classic anime pop, scale-up then collapse ──
  particles.push(new P({
    x: cx, y: cy, lifetime: 0.20,
    size0: 20, size1: 0,
    easeSize: t => t < 0.35 ? E.easeOutBack(t / 0.35) * 1.0
                            : 1 - E.easeInQuart((t - 0.35) / 0.65),
    alpha0: 1, alpha1: 1,
    h0: 195, s0: 25, l0: 95,
    h1: 190, s1: 60, l1: 70,
    shape: 'star', points: 6, innerRatio: 0.42,
    outline: 4, rot: rand(0, TAU),
    easeColor: E.easeOutQuad,
  }));

  // ── 2 GOLD DOTS: small accents flicking outward, opposite directions ──
  const baseAng = rand(0, TAU);
  for (let i = 0; i < 2; i++) {
    const ang = baseAng + i * Math.PI + rand(-0.15, 0.15);
    const sp = rand(220, 300);
    particles.push(new P({
      x: cx, y: cy, lifetime: 0.22,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      drag: 2.5,
      size0: 10, size1: 2,
      easeSize: t => t < 0.2 ? 0.7 + 0.3 * E.easeOutExpo(t / 0.2)
                             : 0.7 - 0.7 * E.easeInQuart((t - 0.2) / 0.8),
      h0: 50, s0: 90, l0: 70,
      h1: 42, s1: 85, l1: 55,
      shape: 'diamond', outline: 2,
      rot: rand(0, TAU), vrot: rand(-5, 5),
      easeColor: E.easeOutQuad,
    }));
  }
}

// ── Render loop ──
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  ctx.fillStyle = '#1a1530';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  // crosshair target
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cvs.width / 2 - 20, cvs.height / 2);
  ctx.lineTo(cvs.width / 2 + 20, cvs.height / 2);
  ctx.moveTo(cvs.width / 2, cvs.height / 2 - 20);
  ctx.lineTo(cvs.width / 2, cvs.height / 2 + 20);
  ctx.stroke();

  for (const p of particles) p.step(dt);
  particles = particles.filter(p => p.life < p.lifetime);
  for (const p of particles) p.draw(ctx);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── Input ──
cvs.addEventListener('click', e => {
  const r = cvs.getBoundingClientRect();
  spawnHitImpactChibi(e.clientX - r.left, e.clientY - r.top);
});

let autoLoop = null;
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (autoLoop) { clearInterval(autoLoop); autoLoop = null; }
    else {
      autoLoop = setInterval(() => {
        spawnHitImpactChibi(cvs.width / 2 + rand(-80, 80), cvs.height / 2 + rand(-80, 80));
      }, 600);
    }
  } else if (e.code === 'KeyR') {
    particles = [];
  }
});

// auto-fire first hit on load
setTimeout(() => spawnHitImpactChibi(cvs.width / 2, cvs.height / 2), 200);
</script>
</body>
</html>
